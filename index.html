<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kizme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f8f9ff 0%, #eef2ff 100%);
        min-height: 100vh;
      }

      .hero-card {
        border: 0;
        border-radius: 1.5rem;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      }

      .logo-img {
        max-width: 180px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card hero-card p-4 p-md-5 text-center">
            <img src="img/logo.png" alt="Logo de Kizme" class="logo-img mx-auto d-block" />
            <h1 class="display-5 fw-bold mt-4 mb-3">Kizme</h1>
            <p class="lead text-muted mb-4">
              Una web para conocer personas, descubrir nuevas conexiones y construir relaciones auténticas.
            </p>
            <div class="alert alert-warning fw-bold fs-4 mb-4" role="alert">
              ESTA EN CONSTRUCCION
            </div>
            <p class="mb-0 text-secondary">
              Estamos preparando una experiencia moderna, sencilla y atractiva para que cada encuentro sea especial.
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
